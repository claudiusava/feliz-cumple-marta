@if (stage() === 'loading') {
  <app-loading (finished)="onLoadingFinished()"></app-loading>
}

@if (stage() !== 'loading') {
  <main class="page">
    <app-hero (reveal)="onReveal()"></app-hero>

    @if (stage() === 'letter') {
      <div #letterAnchor></div>
      <app-letter></app-letter>
    }
  </main>
}
